# Include INSIDE the public TLS server block. Replace old payment locations.
# The application port must stay bound to 127.0.0.1:8000.
location ~ ^/api/(payme|click/(prepare|complete))$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    client_max_body_size 16k;
    client_body_timeout 5s;
    proxy_read_timeout 60s;
    proxy_intercept_errors on;
    error_page 413 = @merchant_bad_request;
    error_page 502 503 504 = @merchant_unavailable;
}

location @merchant_bad_request {
    default_type application/json;
    if ($uri ~ ^/api/click/) {
        return 200 '{"click_trans_id":0,"merchant_trans_id":"","error":-8,"error_note":"Invalid request"}';
    }
    return 200 '{"jsonrpc":"2.0","id":null,"error":{"code":-32600,"message":"Invalid request"}}';
}

location @merchant_unavailable {
    default_type application/json;
    if ($uri ~ ^/api/click/) {
        return 200 '{"click_trans_id":0,"merchant_trans_id":"","error":-7,"error_note":"Failed to update order"}';
    }
    return 200 '{"jsonrpc":"2.0","id":null,"error":{"code":-31008,"message":"Temporarily unavailable"}}';
}
